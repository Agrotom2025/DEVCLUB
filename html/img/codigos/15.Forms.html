<form action="" method="get" enctype="multipart/form-data">
    <h1>Qual é a sua rua?</h1>
<label>
    Rua:
    <input type="text" name="rua" autocomplete="street-address">
</label>
<br>
<label>
    Número da casa:
    <input type="number" name="numero" autocomplete="address-line1">
</label>

<label>
    Escolha um arquivo:
    <input type="file" name="arquivo" >
</label>

<button type="submit">Clique aqui para enviar seus dados</button>
<button type="reset">Clique aqui para limpar seus campos</button>






</form>
